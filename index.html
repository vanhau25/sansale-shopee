<script>

async function paste(){
try{
const text = await navigator.clipboard.readText();
document.getElementById("link").value = text;
}catch{
alert("Không thể dán tự động");
}
}

function copy(){
let text=document.getElementById("result").value;

if(text===""){
alert("Chưa có link để copy");
return;
}

navigator.clipboard.writeText(text);
alert("Đã copy link!");
}


// mở link rút gọn
async function expandLink(url){

try{

let res = await fetch(
"https://ganlinkshopee.hauvan174.workers.dev/?url=" + encodeURIComponent(url)
);

let data = await res.json();

if(data.final_url){
return data.final_url;
}

return url;

}catch{

return url;

}

}


// lấy shopid itemid
function getProductInfo(link){

// bỏ query phía sau
link = link.split("?")[0];

// chuẩn hóa link
link = decodeURIComponent(link);

// tìm shopid itemid trong toàn bộ link
let match = link.match(/(\d{6,})\/(\d{6,})/);

if(match){
return {
shopid: match[1],
itemid: match[2]
};
}

// dạng i.shopid.itemid
match = link.match(/i\.(\d+)\.(\d+)/);

if(match){
return {
shopid: match[1],
itemid: match[2]
};
}

return null;

}


async function convert(){

let link=document.getElementById("link").value.trim();
let affiliate=document.getElementById("affiliate").value;

if(link===""){
alert("Vui lòng dán link Shopee");
return;
}


// nếu là link rút gọn
if(
link.includes("s.shopee.vn") ||
link.includes("vn.shp.ee") ||
link.includes("shope.ee")
){

link = await expandLink(link);

}


// lấy id
let data = getProductInfo(link);

if(!data){

alert("Không nhận diện được link Shopee");

return;

}


// tạo link affiliate
let finalLink =
`https://s.shopee.vn/an_redir?origin_link=https://shopee.vn/product/${data.shopid}/${data.itemid}&affiliate_id=${affiliate}&sub_id=githubtool&deep_and_deferred=1`;

document.getElementById("result").value = finalLink;

}

</script>
